<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=417">
<title>充值申请详情 · 忆托 OMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/td-config.js"></script>
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="phone-wrap">
  <div class="phone-screen" data-nav="申请详情" data-back="true">
    <div class="app">
      <div class="scroll">
        <div class="card p-4" style="margin:12px 16px 0">
          <div class="flex items-center justify-between">
            <div class="text-[13px]" style="color:var(--td-text-3)">RC20260816002</div>
            <span class="td-tag td-tag-error">已拒绝</span>
          </div>
          <div class="price text-[28px] font-semibold mt-2">¥2,000.00</div>
        </div>
        <div class="card mt-3" style="margin:12px 16px 0">
          <div class="cell"><span style="color:var(--td-text-2)">付款方式</span><span class="cell-note" style="color:var(--td-text-1)">微信转账</span></div>
          <div class="cell"><span style="color:var(--td-text-2)">申请时间</span><span class="cell-note" style="color:var(--td-text-1)">2026-08-16 11:20</span></div>
          <div class="cell"><span style="color:var(--td-text-2)">审批意见</span><span class="cell-note" style="color:var(--td-error)">截图模糊</span></div>
        </div>
        <div class="px mt-3 mb-1 text-[13px] font-semibold">付款截图</div>
        <div class="px mb-4">
          <div class="w-28 h-28 rounded-td-lg" style="background:var(--td-gray-3)"></div>
        </div>
      </div>
      <div style="padding:8px 16px 28px;background:#fff;border-top:0.5px solid var(--td-gray-3)">
        <button class="btn btn-primary btn-block" style="height:44px">修改后重新申请</button>
      </div>
    </div>
  </div>
</div>
<script src="assets/chrome.js"></script>
</body>
</html>
