<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=417">
<title>账号密码登录 · 忆托 OMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/td-config.js"></script>
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="phone-wrap">
  <div class="phone-screen" data-nav="账号密码登录" data-back="true" data-back-href="login.html">
    <div class="app">
      <div class="scroll">
        <div class="px py text-[13px] leading-6" style="color:var(--td-text-2)">
          使用 Web 端卖家账号登录，登录后直接进入首页，登录态保留 7 天。
        </div>
        <div class="card" style="margin:0 16px;border:0.5px solid var(--td-gray-3)">
          <div class="cell">
            <div class="w-14 text-[15px] flex-shrink-0">账号</div>
            <input class="flex-1 outline-none text-[15px] bg-transparent" type="text" value="zhangseller" placeholder="请输入 ERP 账号">
          </div>
          <div class="cell">
            <div class="w-14 text-[15px] flex-shrink-0">密码</div>
            <input class="flex-1 outline-none text-[15px] bg-transparent" type="password" value="••••••••" placeholder="请输入密码">
          </div>
        </div>
        <div class="px mt-8">
          <button class="btn btn-primary btn-block" style="height:44px">登录</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/chrome.js"></script>
</body>
</html>
