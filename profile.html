<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=417">
<title>我的 · 忆托 OMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/td-config.js"></script>
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="phone-wrap">
  <div class="phone-screen" data-tab="profile">
    <div class="app">
      <div class="scroll">
        <div style="background:#fff">
          <div class="px pt-4 pb-3 flex items-center gap-3" style="padding-right:108px">
            <img src="assets/img/yituo-logo.png" width="52" height="52" alt="" style="border-radius:14px;flex-shrink:0">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-[18px] font-semibold leading-6">张卖家</span>
                <span class="td-tag td-tag-brand">管理员</span>
              </div>
              <div class="text-[12px] mt-1" style="color:var(--td-text-3)">路途跨境（杭州）· 已绑定 ERP</div>
            </div>
          </div>
          <div class="mx-4 mb-4 grid grid-cols-2" style="border-top:0.5px solid var(--td-gray-3)">
            <div class="py-3 pr-3">
              <div class="text-[11px]" style="color:var(--td-text-3)">企业编号</div>
              <div class="price text-[14px] font-semibold mt-1 tracking-wide">YT882910</div>
            </div>
            <div class="py-3 pl-3" style="border-left:0.5px solid var(--td-gray-3)">
              <div class="text-[11px]" style="color:var(--td-text-3)">手机号</div>
              <div class="text-[14px] font-medium mt-1">138****2618</div>
            </div>
          </div>
        </div>

        <div class="px py">
          <div class="card p-4 flex items-center justify-between">
            <div>
              <div class="text-[12px]" style="color:var(--td-text-3)">账户余额</div>
              <div class="price text-[24px] font-semibold mt-1">¥320.00</div>
            </div>
            <button class="btn btn-primary" style="height:32px;font-size:13px;padding:0 12px">去充值</button>
          </div>
        </div>

        <div class="px mb-1 text-[13px] font-semibold">绑定店铺</div>
        <div class="card" style="margin:0 16px">
          <div class="cell"><span class="cell-title">Amazon US</span><span class="td-tag td-tag-success">已授权</span></div>
          <div class="cell"><span class="cell-title">Temu</span><span class="td-tag td-tag-success">已授权</span></div>
          <div class="cell"><span class="cell-title">TikTok Shop</span><span class="td-tag td-tag-success">已授权</span></div>
        </div>
        <div class="px mt-2 text-[11px] mb-3" style="color:var(--td-text-3)">店铺授权请在 Web 端完成，小程序仅展示状态。</div>

        <div class="card" style="margin:0 16px 16px">
          <div class="cell"><span class="cell-title">余额明细</span><span class="cell-arrow">›</span></div>
          <div class="cell"><span class="cell-title">充值记录</span><span class="cell-arrow">›</span></div>
          <div class="cell"><span class="cell-title">联系客服</span><span class="cell-arrow">›</span></div>
          <div class="cell"><span class="cell-title">关于与帮助</span><span class="cell-note">V1.0.0</span><span class="cell-arrow">›</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/chrome.js"></script>
</body>
</html>
