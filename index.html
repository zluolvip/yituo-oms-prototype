<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忆托微信小程序 OMS · 原型概览</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/td-config.js"></script>
<style>
  :root {
    --td-brand: #0052d9;
    --td-gray-2: #eee;
    --studio: #e8eaef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--studio);
    font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: rgba(0,0,0,0.9);
  }
  .hero {
    padding: 40px 48px 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
  .hero h1 { font-size: 28px; font-weight: 650; letter-spacing: 0.02em; margin: 0; }
  .hero p { margin: 8px 0 0; color: rgba(0,0,0,0.5); font-size: 14px; line-height: 1.6; }
  .group { padding: 8px 48px 40px; }
  .group-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: rgba(0,0,0,0.45);
    text-transform: uppercase;
    margin: 0 0 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 40px 36px;
    align-items: flex-start;
  }
  .phone-card { width: 313px; }
  .phone-card .label {
    font-size: 13px;
    font-style: italic;
    color: #666;
    margin-bottom: 10px;
  }
  .phone-card .stage {
    width: 313px;
    height: 657px;
    position: relative;
  }
  .phone-card iframe {
    position: absolute;
    top: 0; left: 0;
    width: 417px;
    height: 876px;
    border: 0;
    transform: scale(0.75);
    transform-origin: top left;
    background: transparent;
    pointer-events: auto;
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="flex items-start gap-4">
      <img src="assets/img/yituo-logo.png" width="48" height="48" alt="忆托" style="border-radius:12px">
      <div>
        <h1>忆托微信小程序 OMS</h1>
        <p>按 PRD 还原的移动履约原型 · iPhone 15 Pro（393×852）· TDesign 组件语法 · 各屏独立 HTML，本页仅 iframe 平铺，不用页面跳转浏览。</p>
      </div>
    </div>
    <img src="assets/img/tdesign-logo.png" alt="TDesign" height="28" style="height:28px;background:#000;padding:6px 10px;border-radius:6px">
  </header>

  <section class="group">
    <div class="group-title">01 登录与授权</div>
    <div class="row">
      <div class="phone-card"><div class="label">选择登录方式</div><div class="stage"><iframe src="login.html" title="选择登录方式"></iframe></div></div>
      <div class="phone-card"><div class="label">账号密码登录</div><div class="stage"><iframe src="password-login.html" title="账号密码登录"></iframe></div></div>
      <div class="phone-card"><div class="label">微信登录后 · 关联 ERP</div><div class="stage"><iframe src="bind-account.html" title="关联 ERP 账号"></iframe></div></div>
    </div>
  </section>

  <section class="group">
    <div class="group-title">02 底部 Tab 主界面</div>
    <div class="row">
      <div class="phone-card"><div class="label">首页看板</div><div class="stage"><iframe src="home.html" title="首页"></iframe></div></div>
      <div class="phone-card"><div class="label">订单列表</div><div class="stage"><iframe src="orders.html" title="订单管理"></iframe></div></div>
      <div class="phone-card"><div class="label">消息中心</div><div class="stage"><iframe src="messages.html" title="消息中心"></iframe></div></div>
      <div class="phone-card"><div class="label">个人中心</div><div class="stage"><iframe src="profile.html" title="我的"></iframe></div></div>
    </div>
  </section>

  <section class="group">
    <div class="group-title">03 订单履约</div>
    <div class="row">
      <div class="phone-card"><div class="label">订单详情 · 待推单</div><div class="stage"><iframe src="order-detail.html" title="订单详情"></iframe></div></div>
      <div class="phone-card"><div class="label">订单详情 · 工厂打回</div><div class="stage"><iframe src="order-detail-exception.html" title="工厂打回"></iframe></div></div>
      <div class="phone-card"><div class="label">付款推单确认</div><div class="stage"><iframe src="orders-pay.html" title="付款推单确认"></iframe></div></div>
      <div class="phone-card"><div class="label">余额不足拦截</div><div class="stage"><iframe src="orders-insufficient.html" title="余额不足"></iframe></div></div>
    </div>
  </section>

  <section class="group">
    <div class="group-title">04 消息触达</div>
    <div class="row">
      <div class="phone-card"><div class="label">消息详情 · 充值到账</div><div class="stage"><iframe src="message-detail.html" title="消息详情"></iframe></div></div>
    </div>
  </section>

  <section class="group">
    <div class="group-title">05 线下充值</div>
    <div class="row">
      <div class="phone-card"><div class="label">充值申请</div><div class="stage"><iframe src="recharge.html" title="线下充值"></iframe></div></div>
      <div class="phone-card"><div class="label">充值记录</div><div class="stage"><iframe src="recharge-records.html" title="充值记录"></iframe></div></div>
      <div class="phone-card"><div class="label">申请详情 · 已拒绝</div><div class="stage"><iframe src="recharge-detail.html" title="申请详情"></iframe></div></div>
    </div>
  </section>

  <section class="group">
    <div class="group-title">06 个人与资金</div>
    <div class="row">
      <div class="phone-card"><div class="label">余额明细</div><div class="stage"><iframe src="balance.html" title="余额明细"></iframe></div></div>
      <div class="phone-card"><div class="label">关于与帮助</div><div class="stage"><iframe src="help.html" title="关于与帮助"></iframe></div></div>
    </div>
  </section>
</body>
</html>
