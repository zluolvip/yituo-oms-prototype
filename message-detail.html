<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=417">
<title>消息详情 · 忆托 OMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/td-config.js"></script>
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="phone-wrap">
  <div class="phone-screen" data-nav="消息详情" data-back="true">
    <div class="app">
      <div class="scroll">
        <div class="text-center pt-8 pb-4">
          <div class="w-14 h-14 rounded-full mx-auto flex items-center justify-center text-[22px] font-semibold" style="background:var(--td-success-1);color:var(--td-success)">¥</div>
          <div class="mt-3 text-[17px] font-semibold">充值到账通知</div>
          <div class="mt-1 text-[12px]" style="color:var(--td-text-3)">2026-08-18 10:32</div>
        </div>
        <div class="card" style="margin:0 16px">
          <div class="cell"><span style="color:var(--td-text-2)">消息类型</span><span class="cell-note" style="color:var(--td-text-1)">充值消息</span></div>
          <div class="cell"><span style="color:var(--td-text-2)">充值金额</span><span class="cell-note price font-semibold" style="color:var(--td-success)">¥5,000.00</span></div>
          <div class="cell"><span style="color:var(--td-text-2)">到账时间</span><span class="cell-note" style="color:var(--td-text-1)">2026-08-18 10:30</span></div>
          <div class="cell"><span style="color:var(--td-text-2)">当前余额</span><span class="cell-note price" style="color:var(--td-text-1)">¥5,320.00</span></div>
        </div>
        <div class="px mt-6">
          <button class="btn btn-primary btn-block">查看余额明细</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/chrome.js"></script>
</body>
</html>
