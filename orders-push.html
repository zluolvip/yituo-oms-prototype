<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=417">
<title>推单确认 · 忆托 OMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/td-config.js"></script>
<link rel="stylesheet" href="assets/common.css">
</head>
<body>
<div class="phone-wrap">
  <div class="phone-screen" data-nav="订单管理" data-tab="orders">
    <div class="app">
      <div class="scroll" style="filter:blur(1px)"></div>
      <div class="mask">
        <div class="dialog">
          <div class="text-center text-[16px] font-semibold mb-4">确认推单到工厂</div>
          <div class="flex justify-between py-2 text-[14px]"><span style="color:var(--td-text-2)">已选订单</span><span>3 笔</span></div>
          <div class="flex justify-between py-2 text-[14px]"><span style="color:var(--td-text-2)">涉及工厂</span><span>义乌工厂 A</span></div>
          <div class="flex justify-between py-2 text-[14px]"><span style="color:var(--td-text-2)">预计生产周期</span><span>2–3 个工作日</span></div>
          <div class="mt-2 text-[12px] leading-5" style="color:var(--td-text-3)">仅「待推单」订单可推送。缺少生产图的订单将拦截，需先在 Web 端处理。</div>
          <div class="flex gap-3 mt-5">
            <button class="btn btn-outline flex-1">取消</button>
            <button class="btn btn-primary flex-1">确认推单</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/chrome.js"></script>
</body>
</html>
